<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d1716"><title>チャーハン大回転 | birdman studio</title><meta name="description" content="世界のどこでも鍋を振れ！ 揺れを読み、ごはんをこぼさず、最高のチャーハンを作るアクションゲーム。"><link rel="stylesheet" href="./style.css"></head>
<body><main class="shell">
  <header><span class="brand">BIRDMAN STUDIO <b>／ 遊べる試作</b></span><button id="sound" aria-label="音を切り替え">音 ON</button></header>
  <section class="hud" aria-label="調理状況"><div><small>場所</small><strong id="place">路地裏の屋台</strong></div><div><small>残り時間</small><strong id="clock">54</strong></div><div><small>連続返し</small><strong id="combo">0</strong></div></section>
  <div class="stage" id="swipeZone"><canvas id="scene" width="780" height="900" aria-label="鍋とチャーハンのゲーム画面。手前へ引くように下へスワイプして鍋を振る"></canvas><div class="stage-tag" id="stageTag">01 / 03</div><div class="swipe-hint" id="swipeHint">↓ 手前へ引いて、鍋を返す</div><div class="stage-notice" id="stageNotice" role="status" aria-live="polite" hidden><small>次の舞台</small><strong id="noticeTitle"></strong><span id="noticeDetail"></span></div><div class="balance-label">← 左へ傾く <span>鍋のバランス</span> 右へ傾く →</div><div class="balance-track"><i id="balanceNeedle"></i><em></em></div><div class="tip" id="tip">手前へ引くように下へ。強さと方向で米の回り方が変わる。</div></div>
  <section class="meters"><div><span>残ったごはん</span><div class="bar"><i id="riceBar"></i></div></div><div><span>火の通り</span><div class="bar"><i id="cookBar"></i></div></div><div><span>混ざり具合</span><div class="bar"><i id="mixBar"></i></div></div></section>
  <div class="cook-controls"><button id="seasoning">調味料を入れる<small id="seasonHint">一度だけ・中盤が狙い目</small></button><div class="heat-controls"><button id="heatDown">火を弱める</button><span id="heatLabel">火力 48%</span><button id="heatUp">火を強める</button></div></div>
  <button id="motionButton" class="motion-button" type="button">端末を手前に引いて遊ぶ <small id="motionStatus">対応端末のみ・タップで許可</small></button>
  <p class="help">鍋を手前に引くように下へスワイプ。横ドラッグで傾きを戻す。キーボード：← →／SPACE／↑ ↓、Sで調味料。</p>
  <div class="overlay" id="overlay"><div class="card"><div class="eyebrow">世界を渡る、ひと皿。</div><h1 id="overlayTitle">チャーハン<br><span>大回転</span></h1><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 320 120" role="presentation"><defs><linearGradient id="pan" x2="0" y2="1"><stop stop-color="#719b9b"/><stop offset=".25" stop-color="#e6d3a2"/><stop offset=".45" stop-color="#20363b"/><stop offset="1" stop-color="#0c171c"/></linearGradient><linearGradient id="rice" x2="0" y2="1"><stop stop-color="#fff7cc"/><stop offset="1" stop-color="#e6a453"/></linearGradient></defs><path d="M90 63 Q160 -14 232 62" fill="none" stroke="#fff2bf" stroke-width="2" stroke-dasharray="3 7" opacity=".8"/><g fill="url(#rice)"><ellipse cx="101" cy="55" rx="6" ry="3" transform="rotate(-28 101 55)"/><ellipse cx="120" cy="35" rx="6" ry="3" transform="rotate(-12 120 35)"/><ellipse cx="139" cy="25" rx="6" ry="3" transform="rotate(24 139 25)"/><ellipse cx="164" cy="17" rx="6" ry="3" transform="rotate(-14 164 17)"/><ellipse cx="189" cy="26" rx="6" ry="3" transform="rotate(35 189 26)"/><ellipse cx="211" cy="40" rx="6" ry="3" transform="rotate(-25 211 40)"/><ellipse cx="230" cy="58" rx="6" ry="3" transform="rotate(22 230 58)"/></g><g fill="#81b96c"><circle cx="112" cy="43" r="3"/><circle cx="181" cy="18" r="3"/><circle cx="222" cy="50" r="3"/></g><g fill="#ed8b52"><circle cx="135" cy="29" r="3"/><circle cx="200" cy="30" r="3"/></g><path d="M30 75 Q160 145 290 75 Q256 113 160 116 Q66 112 30 75" fill="url(#pan)"/><ellipse cx="160" cy="75" rx="131" ry="27" fill="#b8c6af"/><ellipse cx="160" cy="74" rx="122" ry="21" fill="#223237"/><ellipse cx="160" cy="73" rx="109" ry="16" fill="#e9b86e"/><g fill="#fff0bc"><ellipse cx="89" cy="72" rx="8" ry="3"/><ellipse cx="120" cy="65" rx="8" ry="3"/><ellipse cx="152" cy="76" rx="8" ry="3"/><ellipse cx="183" cy="65" rx="8" ry="3"/><ellipse cx="217" cy="76" rx="8" ry="3"/><ellipse cx="240" cy="68" rx="8" ry="3"/></g><path d="M280 75 L319 69 L319 86 L281 84Z" fill="#506463"/></svg></div><p id="overlayText">鍋を手前へ、下にスワイプ！ ほどよい強さで米を返し、火加減と調味料のタイミングを見極めよう。</p><button id="start">調理スタート</button><div class="mini">屋台 → 列車 → 空中キッチン</div></div></div>
  </main><script type="module" src="./game.js"></script></body></html>
