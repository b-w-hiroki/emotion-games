<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c3b"><title>釣りバトル｜試作</title><link rel="stylesheet" href="./style.css"></head><body><main class="game"><header><span class="eyebrow">FISHING BATTLE / PROTOTYPE</span><h1>引きに、あわせる。</h1><p>暴れたら待つ。静まったら、巻く。</p></header><section class="board" aria-label="釣りバトル"><canvas id="sea" aria-hidden="true"></canvas><div class="top"><div class="fish-name" id="fishName">アジ</div><div class="meter"><span>糸の危険</span><div class="track danger"><i id="dangerFill"></i></div></div><div class="meter"><span>引き寄せ</span><div class="track progress"><i id="progressFill"></i></div></div></div><div class="cue" id="cue" role="status" aria-live="polite">魚の動きを見よう</div><div class="result" id="result" hidden><h2 id="resultTitle"></h2><p id="resultText"></p><button id="retry">もう一度</button></div><div class="controls"><button id="reel" type="button"><b>巻く</b><span>タップ / 下へスワイプ / Space</span></button><span id="hint">魚が落ち着いている。巻こう</span></div></section><footer><label>魚を選ぶ <select id="fish"><option value="aji">アジ</option><option value="tai">マダイ</option><option value="buri">ブリ</option></select></label><button id="mute" type="button" aria-pressed="false">音 ON</button><p>バトル部分だけを遊べる試作。釣果やセーブには接続していません。</p></footer></main><script type="module" src="./game.js"></script></body></html>
