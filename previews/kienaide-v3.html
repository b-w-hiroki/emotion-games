</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),scene=$('scene'),endings=[{id:'blown',title:'風にさらわれた。',desc:'消えたのは灯りだけだろうか。'},{id:'smother',title:'守りすぎた。',desc:'守る手の中で、息が尽きた。'},{id:'wish',title:'わすれない。',desc:'灯りは弱っても、記憶が道を照らした。'},{id:'survive',title:'まだ、ここに。',desc:'震える光を抱いて、家までたどり着いた。'},{id:'dawn',title:'おかえり。',desc:'最後に手放したとき、向こうの窓から光が返ってきた。'}];

 {id:'gust',at:22,end:27,label:'突風！',tip:'いまは手で守る',wind:.38},

function updateUI(){if(!s)return;const flame=Math.round(s.flame),oxy=Math.round(s.oxy);$('lampNum').textContent=flame+'%';$('airNum').textContent=oxy+'%';$('lampBar').style.width=flame+'%';$('airBar').style.width=oxy+'%';$('memCount').textContent=s.memories.length+' / 3';$('distance').textContent='家まで '+Math.max(0,Math.ceil(100-s.t/90*100))+'m';scene.style.setProperty('--glow',String(.05+s.flame/100*.4));scene.style.setProperty('--strength',String(Math.max(.16,s.flame/100)));scene.style.setProperty('--brightness',String(.62+s.flame/100*.48));const strength=Math.max(0,Math.min(1,s.flame/100));scene.style.setProperty('--flame-opacity',String(strength<=.01?0:Math.max(.15,strength)));scene.style.setProperty('--flame-scale',String(Math.max(.12,.48+strength*.65)));scene.classList.toggle('extinguished',s.flame<=0);scene.classList.toggle('faint',s.flame<27);scene.classList.toggle('protected',hold);const hint=hold?(s.oxy<30||s.wind<.44?'今、手を離して息を戻す':'手の中で守っている'):(s.wind>.56?'風が来る！ 長押しで守ろう':'凪いでいる。息を戻そう');$('hintText').textContent=hint; if(audio&&audioEnabled)audio.windGain.gain.setTargetAtTime(.02+s.wind*.12,audio.ctx.currentTime,.09)}
function story(name,line){$('chapterTitle').textContent=name;$('chapterLine').textContent=line;const node=$('chapter');node.classList.remove('new');void node.offsetWidth;node.classList.add('new');note(470,.4)}
function start(){initAudio();audio?.ctx.resume();window.clearTimeout(flashTimeout);$('memoryFlash').classList.remove('active');$('eventCue').classList.remove('visible');s={t:0,flame:72,oxy:100,wind:.15,chapter:0,memories:[],rescued:false,releaseAt:-100,shown:[],ending:null,eventId:null,shelterUsed:false,shelterUntil:0,peakWind:0,frost:0,frostWarned:false};const qaEvent=speed>1?new URLSearchParams(location.search).get('qa_event'):null;if(qaEvent){const target=dynamicEvents.find(e=>e.id===qaEvent);if(target){s.t=target.at-.6;s.chapter=s.t>=70?3:s.t>=45?2:s.t>=20?1:0;scene.className='phone chapter-'+s.chapter}}hold=false;last=0;visibleMemory=null;scene.className='phone chapter-'+s.chapter;showChapterArt(s.chapter);$('modal').hidden=true;$('hold').disabled=false;$('memory').hidden=true;story(chapters[0].name,chapters[0].line);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}

function tick(now){if(!s||s.ending)return;const dt=Math.min(.04,last?(now-last)/1000:0)*speed;last=now;s.t+=dt;
const ch=s.t>=70?3:s.t>=45?2:s.t>=20?1:0;if(ch!==s.chapter){s.chapter=ch;scene.className='phone chapter-'+ch;showChapterArt(ch);story(chapters[ch].name,chapters[ch].line)}

if(safe&&!s.shelterUsed){s.shelterUsed=true;story('建物の陰','いまだけ風が止んだ。息を戻そう。');note(720,.35)}
s.wind=Math.max(.07,Math.min(1.15,.12+gust*(.43+ch*.105)+cross*.14+tunnel+(event?.wind||0)-(safe?.48:0)));
s.peakWind=Math.max(s.peakWind,s.wind);
const cold=ch===2?(!hold?Math.max(0,s.wind-.26)*20:-15):-22;
s.frost=Math.max(0,Math.min(100,s.frost+cold*dt));
if(ch===2&&!s.frostWarned&&s.frost>=43){
 s.frostWarned=true;story('凍った橋　氷の息','手を離すと、冷気が炎にまとわりつく。');note(160,.27);
}
scene.style.setProperty('--frost-opacity',String(Math.max(0,Math.min(.9,s.frost/100*.9))));
const oxyCost=(4.5+s.wind*3.8+(ch===2?1.2:0))*(event?.id==='vortex'?1.75:1);
if(hold){s.oxy=Math.max(0,s.oxy-oxyCost*dt);s.flame=Math.min(100,s.flame+(1.35-s.wind*.35)*dt)}
else{s.oxy=Math.min(100,s.oxy+(safe?26:15)*dt);s.flame=Math.max(0,Math.min(100,s.flame+(s.wind>.5?-(7+s.wind*8)*(ch===2?1.62:1):2.25-(ch===2?s.frost*.027:0))*dt))}

scene.classList.toggle('tailwind',event?.id==='tailwind');

scene.classList.toggle('afraid',s.flame<35||s.wind>.72);
scene.classList.toggle('comfort',hold&&s.wind<.5);
scene.classList.toggle('hope',s.rescued);

if(!s.rescued&&s.t>=70&&s.t<89&&s.memories.length>=2&&s.flame>0&&s.flame<=32&&s.oxy>30&&!hold&&s.t-s.releaseAt<1.4&&s.t-s.releaseAt>=0&&s.wind<.48){s.rescued=true;s.flame=Math.min(100,s.flame+35);story('夜明け前　返事の光','手を離した瞬間、あの窓から光が返ってきた。');$('cutin').classList.add('active');note(830,.9);window.clearTimeout(cutinTimeout);cutinTimeout=setTimeout(()=>$('cutin').classList.remove('active'),reduce?400:1900)}
