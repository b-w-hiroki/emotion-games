</style></head><body><main class="phone" id="scene" aria-label="きえないで。短編ゲーム">

</main><script>
(()=>{'use strict';

const chapters=[{at:0,name:'第一章　雪の路地',line:'窓の灯りが、帰り道の目印だった。'},{at:20,name:'第二章　風のトンネル',line:'風に逆らわず、建物の陰でひと息。'},{at:45,name:'第三章　凍った橋',line:'あの窓に届けたい。あと少し。'},{at:70,name:'最終章　夜明け前',line:'守るだけでは、届かない。'}];
const memorySpawns=[{id:'scarf',at:12},{id:'table',at:37},{id:'promise',at:62}];let s=null,raf=0,last=0,hold=false,audio=null,audioEnabled=false,visibleMemory=null,cutinTimeout=0;
const speed=new URLSearchParams(location.search).has('qa')?12:1;

const snow=$('snow');for(let i=0;i<(reduce?15:50);i++){const f=document.createElement('i');const x=(i*29.37+11)%100;f.style.cssText=`--x:${x}%;--r:${i%8===0?3.3:1.5}px;--a:${.17+(i%8)*.07};--d:${7+i%9}s;--delay:${-i*.75}s;--blur:${i%5===0?1:0}px`;snow.append(f)}
function initAudio(){if(audio)return;const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const ctx=new AudioCtx(),master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);const noise=ctx.createBufferSource(),buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),arr=buf.getChannelData(0);for(let i=0;i<arr.length;i++)arr[i]=(Math.random()*2-1);noise.buffer=buf;noise.loop=true;const lp=ctx.createBiquadFilter(),windGain=ctx.createGain();lp.type='lowpass';lp.frequency.value=600;windGain.gain.value=.035;noise.connect(lp).connect(windGain).connect(master);noise.start();audio={ctx,master,windGain}}

$('audioBtn').onclick=()=>{initAudio();audioEnabled=!audioEnabled;audio?.ctx.resume();if(audio)audio.master.gain.value=audioEnabled ? .16 : 0;$('audioBtn').textContent=audioEnabled?'音 ON':'音 OFF';$('audioBtn').setAttribute('aria-pressed',String(audioEnabled));$('audioBtn').setAttribute('aria-label',audioEnabled?'音をオフにする':'音をオンにする')};
function updateUI(){if(!s)return;const flame=Math.round(s.flame),oxy=Math.round(s.oxy);$('lampNum').textContent=flame+'%';$('airNum').textContent=oxy+'%';$('lampBar').style.width=flame+'%';$('airBar').style.width=oxy+'%';$('memCount').textContent=s.memories.length+' / 3';$('distance').textContent='家まで '+Math.max(0,Math.ceil(100-s.t/90*100))+'m';scene.style.setProperty('--glow',String(.05+s.flame/100*.4));scene.style.setProperty('--strength',String(Math.max(.16,s.flame/100)));scene.style.setProperty('--brightness',String(.62+s.flame/100*.48));scene.classList.toggle('faint',s.flame<27);scene.classList.toggle('protected',hold);const hint=hold?(s.oxy<30||s.wind<.44?'今、手を離して息を戻す':'手の中で守っている'):(s.wind>.56?'風が来る！ 長押しで守ろう':'凪いでいる。息を戻そう');$('hintText').textContent=hint; if(audio&&audioEnabled)audio.windGain.gain.setTargetAtTime(.02+s.wind*.12,audio.ctx.currentTime,.09)}
function story(name,line){$('chapterTitle').textContent=name;$('chapterLine').textContent=line;const node=$('chapter');node.classList.remove('new');void node.offsetWidth;node.classList.add('new');note(470,.4)}
function start(){initAudio();audio?.ctx.resume();s={t:0,flame:72,oxy:100,wind:.15,chapter:0,memories:[],rescued:false,releaseAt:-100,shown:[],ending:null};hold=false;last=0;visibleMemory=null;scene.className='phone chapter-0';$('modal').hidden=true;$('hold').disabled=false;$('memory').hidden=true;story(chapters[0].name,chapters[0].line);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
$('start').onclick=start;
function release(){if(!hold)return;hold=false;if(s){s.releaseAt=s.t;$('hold').classList.remove('held')}}
$('hold').addEventListener('pointerdown',e=>{if(!s||s.ending)return;e.preventDefault();hold=true;$('hold').classList.add('held');try{$('hold').setPointerCapture(e.pointerId)}catch(err){}});
['pointerup','pointercancel','lostpointercapture'].forEach(type=>$('hold').addEventListener(type,release));window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});
$('hold').addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&s&&!s.ending){e.preventDefault();hold=true;$('hold').classList.add('held')}});window.addEventListener('keyup',e=>{if(e.code==='Space')release()});
$('memory').onclick=()=>{if(!visibleMemory||!s||s.ending)return;const id=visibleMemory.id;if(!s.memories.includes(id)){s.memories.push(id);note(780,.3);story('記憶が灯った。', ['あたたかなマフラーの記憶。','食卓に残る、誰かの笑顔。','「帰っておいで」という約束。'][s.memories.length-1])}visibleMemory=null;$('memory').hidden=true};
function tick(now){if(!s||s.ending)return;const dt=Math.min(.04,last?(now-last)/1000:0)*speed;last=now;s.t+=dt;
const ch=s.t>=70?3:s.t>=45?2:s.t>=20?1:0;if(ch!==s.chapter){s.chapter=ch;scene.className='phone chapter-'+ch;story(chapters[ch].name,chapters[ch].line)}
const gust=Math.pow((Math.sin(s.t*(.42+ch*.055)-.9)+1)/2,2.3),cross=Math.pow((Math.sin(s.t*.19+1.8)+1)/2,4),tunnel=ch===1?Math.pow((Math.sin(s.t*.83)+1)/2,6)*.24:0;s.wind=Math.min(1.1,.12+gust*(.43+ch*.105)+cross*.14+tunnel);

})();
