name: Verify and deploy Emotion Games
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# PR checks must not cancel (or be cancelled by) the main deploy: group per ref, and only
# superseded PR runs are cancelled. The deploy job serialises Pages publishing on its own.
concurrency:
  group: emotion-games-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node scripts/check-docs.mjs
      - run: npm run build
      - run: node scripts/check-build.mjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    concurrency:
      group: emotion-games-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          PUBLIC_ORIGIN: https://play.birdman-studio.com
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
