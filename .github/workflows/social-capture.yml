name: Browser QA and social captures
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-social.mjs
      - run: node scripts/qa-endings.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emotion-games-social-qa
          path: artifacts/
          retention-days: 30
