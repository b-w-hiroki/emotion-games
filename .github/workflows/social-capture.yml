name: Browser QA and social captures
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/qa-kienaide-image-noise.mjs
      - run: node scripts/qa-kienaide-release.mjs chromium
      - run: node scripts/qa-game-detail.mjs chromium
      - run: node scripts/qa-kienaide-card.mjs chromium
      - run: node scripts/capture-social.mjs
      - run: node scripts/qa-endings.mjs
      - run: node scripts/qa-20.mjs
      - run: node scripts/qa-research.mjs
      - run: node scripts/qa-art-preview.mjs
      - run: node scripts/qa-kienaide-visual.mjs chromium
      - run: command -v ffmpeg && command -v ffprobe || sudo apt-get install -y ffmpeg
        timeout-minutes: 5
      - run: node scripts/capture-kienaide-clip.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emotion-games-social-qa
          path: artifacts/
          retention-days: 30
  webkit:
    # Safari engine QA for 004: layout, audio-gesture start, prologue, all chapters and endings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: node scripts/qa-kienaide-release.mjs webkit
      - run: node scripts/qa-game-detail.mjs webkit
      - run: node scripts/qa-kienaide-card.mjs webkit
      - run: node scripts/qa-research.mjs webkit
      - run: node scripts/qa-kienaide-visual.mjs webkit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kienaide-webkit-qa
          path: artifacts/kienaide/
          retention-days: 30
