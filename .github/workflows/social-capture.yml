name: Browser QA and social captures
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/qa-kienaide-image-noise.mjs
      - run: node scripts/qa-kienaide-release.mjs chromium
      - run: node scripts/qa-game-detail.mjs chromium
      - run: node scripts/qa-studio-works.mjs chromium
      - run: node scripts/qa-chahan.mjs chromium
      - run: node scripts/qa-fishing-battle.mjs chromium
      - run: node scripts/qa-kienaide-card.mjs chromium
      - run: node scripts/capture-social.mjs
      - run: node scripts/qa-endings.mjs
      - run: node scripts/qa-20.mjs
      - run: node scripts/qa-research.mjs
      - run: node scripts/qa-art-preview.mjs
      - run: node scripts/qa-kienaide-visual.mjs chromium
      - name: Install pinned clip encoders
        run: |
          npm ci --prefix scripts/clip-tools --no-audit --no-fund
          test -x scripts/clip-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg
          test -x scripts/clip-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe
          scripts/clip-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg -hide_banner -encoders | grep libx264
          echo "$GITHUB_WORKSPACE/scripts/clip-tools/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts/clip-tools/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
        timeout-minutes: 10
      - run: node scripts/capture-kienaide-clip.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emotion-games-social-qa
          path: artifacts/
          retention-days: 30
  webkit:
    # Safari engine QA for 004: layout, audio-gesture start, prologue, all chapters and endings.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/qa-kienaide-release.mjs webkit
      - run: node scripts/qa-game-detail.mjs webkit
      - run: node scripts/qa-studio-works.mjs webkit
      - run: node scripts/qa-chahan.mjs webkit
      - run: node scripts/qa-fishing-battle.mjs webkit
      - run: node scripts/qa-kienaide-card.mjs webkit
      - run: node scripts/qa-research.mjs webkit
      - run: node scripts/qa-kienaide-visual.mjs webkit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kienaide-webkit-qa
          path: |
            artifacts/kienaide/
            artifacts/fishing-battle/
            artifacts/chahan/
            artifacts/studio/
          retention-days: 30
